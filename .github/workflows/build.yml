name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 opencv-python scikit-image scipy numpy openpyxl xlsxwriter python-pptx qtawesome Pillow segment-anything
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Download SAM model (SHA-256 verified)
        env:
          SAM_URL: https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
          SAM_SHA256: ec2df62732614e57411cdcf32a23ffdf28910380d03139ee0f4fcbe91eb8c912
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $dest = "models/sam_vit_b_01ec64.pth"
          if (Test-Path $dest) {
            $existing = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
            if ($existing -eq $env:SAM_SHA256) {
              Write-Host "SAM checkpoint already present and hash-verified, skipping download."
            } else {
              Write-Host "Existing SAM checkpoint hash mismatch - re-downloading."
              Remove-Item $dest -Force
            }
          }
          if (-not (Test-Path $dest)) {
            Invoke-WebRequest -Uri $env:SAM_URL -OutFile $dest
          }
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
          if ($hash -ne $env:SAM_SHA256) {
            Remove-Item $dest -Force -ErrorAction SilentlyContinue
            Write-Error "SAM checkpoint SHA-256 mismatch. Expected $($env:SAM_SHA256), got $hash. Aborting build."
            exit 1
          }
          Write-Host "SAM checkpoint SHA-256 verified: $hash"

      - name: Generate icon
        run: python -m ui.design.branding resources\icon.ico

      - name: Build with PyInstaller
        run: pyinstaller grain_analyzer.spec --clean --noconfirm

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate NSIS script
        run: python create_nsis_script.py

      - name: Create installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GrainAnalyzer_Setup.exe

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: GrainAnalyzer-Windows-Setup
          path: GrainAnalyzer_Setup.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 opencv-python scikit-image scipy numpy openpyxl xlsxwriter python-pptx qtawesome Pillow segment-anything
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Download SAM model (SHA-256 verified)
        env:
          SAM_URL: https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
          SAM_SHA256: ec2df62732614e57411cdcf32a23ffdf28910380d03139ee0f4fcbe91eb8c912
        run: |
          mkdir -p models
          dest=models/sam_vit_b_01ec64.pth
          if [ -f "$dest" ]; then
            existing=$(shasum -a 256 "$dest" | awk '{print $1}')
            if [ "$existing" = "$SAM_SHA256" ]; then
              echo "SAM checkpoint already present and hash-verified, skipping download."
            else
              echo "Existing SAM checkpoint hash mismatch - re-downloading."
              rm -f "$dest"
            fi
          fi
          if [ ! -f "$dest" ]; then
            curl -L -o "$dest" "$SAM_URL"
          fi
          actual=$(shasum -a 256 "$dest" | awk '{print $1}')
          if [ "$actual" != "$SAM_SHA256" ]; then
            echo "ERROR: SAM checkpoint SHA-256 mismatch. Expected $SAM_SHA256, got $actual. Aborting build." >&2
            rm -f "$dest"
            exit 1
          fi
          echo "SAM checkpoint SHA-256 verified: $actual"

      - name: Generate icon
        run: |
          python -c "
          from PIL import Image, ImageDraw
          import os
          os.makedirs('resources', exist_ok=True)
          img = Image.new('RGBA', (512,512), (26,43,74,255))
          draw = ImageDraw.Draw(img)
          draw.ellipse([60,60,452,452], fill=(0,140,200,255))
          draw.ellipse([140,140,372,372], fill=(26,43,74,255))
          draw.rectangle([236,80,276,432], fill=(255,255,255,255))
          draw.rectangle([80,236,432,276], fill=(255,255,255,255))
          img.save('resources/icon.icns')
          img.save('resources/icon.ico')
          "

      - name: Build with PyInstaller
        run: pyinstaller grain_analyzer.spec --clean --noconfirm

      - name: Create DMG
        run: hdiutil create -volname "Grain Analyzer" -srcfolder "dist/GrainAnalyzer.app" -ov -format UDZO GrainAnalyzer.dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GrainAnalyzer.dmg

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: GrainAnalyzer-macOS-DMG
          path: GrainAnalyzer.dmg
          retention-days: 7
